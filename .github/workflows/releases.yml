name: release version

on:
  push:
    tags:
      - "*.*.*-pg"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Read Tag Version
        id: version
        run: echo version=$(echo "${{ github.event.ref }}") >> $GITHUB_OUTPUT

      - name: Get Repository Name in Lowercase
        id: name
        run: echo image_name=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]') >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.name.outputs.image_name }}
          tags: |
            ${{ steps.version.outputs.version }}
            latest

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: xxl-job-admin/.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.name.outputs.image_name }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Release
        uses: softprops/action-gh-release@v3